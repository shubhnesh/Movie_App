name: Flutter APK Build

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      
      # 1. Check out the repository code
      - name: Checkout
        uses: actions/checkout@v4

       # 2. Set up Java (required for Android builds)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Set up the Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'

      # 4. Get Flutter packages
      - name: Install Packages
        run: flutter pub get

      # 5. Build the Android release APK (or appbundle)
      - name: Build Release APK
        run: flutter build apk --release

       # 6. Upload the generated build artifact to GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # 7. Get Artifact URL
      - name: Get Artifact URL
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=$(gh api \
            repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | select(.name=="release-apk") | .id' \
            | head -n 1)

          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${ARTIFACT_ID}"

          echo "Artifact ID: $ARTIFACT_ID"
          echo "Artifact URL: $ARTIFACT_URL"

          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      # 8. Send APK via Gmail
      - name: Send APK via Email
        uses: dawidd6/action-send-mail@v3
        with:
          # Specify connection via URL (replaces server_address, server_port, secure,
          # username and password)
          
          # Required mail server address if not connection_url:
          server_address: smtp.gmail.com

          # Server port, default 25:
          server_port: 465

          # Optional: whether this connection uses TLS (default is true if server_port is 465)
          secure: true

          # Optional (recommended) mail server username:
          username: ${{secrets.MAIL_USERNAME}}

          # Optional (recommended) mail server password:
          password: ${{secrets.MAIL_PASSWORD}}

          # Required mail subject:
          subject: "APK Build #${{github.run_number}}"

          # Optional recipients. Separate multiple addresses by a comma (possibly surrounded by whitespace):
          to: shubhneshkashyap92@gmail.com, siddhantbisht440@gmail.com
          from: GitHub CI

          # Optional plain body:
          html_body: |
            <html>
              <body>

                <h2>🚀 Flutter APK Build Successful</h2>

                <p>
                  Your Flutter APK has been built successfully.
                </p>

                <p>
                  <strong>Repository:</strong>
                  ${{ github.repository }}
                  <br>

                  <strong>Branch:</strong>
                  ${{ github.ref_name }}
                  <br>

                  <strong>Build:</strong>
                  #${{ github.run_number }}
                  <br>

                  <strong>Commit:</strong>
                  ${{ github.sha }}
                </p>

                <p>
                  <a href="${{ steps.artifact.outputs.artifact_url }}">
                    📱 Download APK
                  </a>
                </p>

              </body>
            </html>
  
